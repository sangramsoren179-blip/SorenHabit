<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SorenHabit</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/overview.css">
    <link rel="stylesheet" href="css/habits.css">
    <link rel="stylesheet" href="css/delete.css">
    <link rel="stylesheet" href="css/bottom-navigation.css">
</head>
<body>

    <div id="app">

        <header>
            <h1>SorenHabit</h1>
        </header>

        <main>

            <section id="overview" class="overview" data-page hidden>
                <h2>Overview</h2>

                <div>
                    <h3>Today's Date</h3>
                    <p id="current-date"></p>
                </div>
            </section>

            <section id="habits" class="habits" data-page hidden>
                <h2>My Habits</h2>

                <button id="add-habit-button" type="button">+ Add Habit</button>

                <div id="habit-modal" class="habit-modal" hidden>
                    <form id="habit-form" class="habit-form">
                        <h3>Add Habit</h3>

                        <div>
                            <label for="habit-name">Habit Name</label>
                            <input id="habit-name" name="habitName" type="text" required>
                        </div>

                        <div>
                            <label for="habit-description">Description</label>
                            <textarea id="habit-description" name="habitDescription"></textarea>
                        </div>

                        <div class="habit-form-actions">
                            <button id="cancel-habit-button" type="button">Cancel</button>
                            <button type="submit">Create</button>
                        </div>
                    </form>
                </div>

                <div id="more-options-menu" class="more-options-menu" hidden>
                    <button id="delete-habit-option" type="button">Delete habit</button>
                </div>

                <div id="delete-modal" class="delete-modal" hidden>
                    <form id="delete-form" class="delete-form">
                        <h3>Delete Habit</h3>

                        <p id="delete-message"></p>

                        <p id="math-question"></p>

                        <div>
                            <label for="math-answer">Your answer</label>
                            <input
                                id="math-answer"
                                name="mathAnswer"
                                type="number"
                                required
                                autocomplete="off"
                            >
                        </div>

                        <p id="delete-error" class="delete-error" hidden></p>

                        <div class="delete-form-actions">
                            <button id="cancel-delete-button" type="button">Cancel</button>
                            <button type="submit">Delete</button>
                        </div>
                    </form>
                </div>

                <div id="habits-list" class="habits-list"></div>

                <div id="habits-empty" class="habits-empty">
                    <p>No habits added yet.</p>
                    <p>Start by adding your first habit.</p>
                </div>
            </section>

        </main>

        <footer>
            <nav class="bottom-navigation">
            </nav>
        </footer>

    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
